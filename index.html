const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

 qb.innerHTML=`<div><div class="qw"><svg class="tr" viewBox="0 0 100 100" preserveAspectRatio="none"><rect class="k" x="1.5" y="1.5" width="97" height="97" rx="9"/><rect class="t" x="1.5" y="1.5" width="97" height="97" rx="9" pathLength="100"/></svg><div class="qi">${svg}</div></div><div class="cd" id="cd">1:00</div><p class="hint">Отсканируй на другом устройстве.<br>${days?'В коде история за '+days+' '+pl(days,['день','дня','дней']):'В коде только список привычек'}.</p></div>`;

  clearInterval(tm);QC='';const b=$('#qb');if(b)b.innerHTML=`<div class="qx"><span>${I('lock')}</span><b>Код истёк</b><small>QR удалён с экрана</small></div>`;const a=$('#qa');if(a)a.innerHTML=`<div class="acts"><button class="btn p" data-a="qnew">Создать новый</button></div>`},250)}
async function scan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('Сканер не поддерживается. Вставь код вручную');

async function ingest(raw){raw=(raw||'').trim();let o;
 try{if(raw.startsWith('KRL1.')){const j=JSON.parse(new TextDecoder().decode(await pipe(DecompressionStream,unb64(raw.slice(5)))));
   if(j.x&&Math.abs(Date.now()-j.x)>75e3)return toast('Код истёк. Создай новый на другом устройстве');
   const t=today(),log={};o={habits:j.h.map(a=>norm({id:a[0],name:a[1],emoji:a[2],color:a[3],track:a[4],goal:a[5],unit:a[6],days:String(a[7]).split(''),created:a[8]}))};
   for(const id in j.l){const l=log[String(id).replace(/[^\w-]/g,'')]={};j.l[id].forEach(([n,v])=>{if(+v>0)l[key(addD(t,-n))]=+v})}o.log=log}
  else{const j=JSON.parse(raw);if(!Array.isArray(j.habits))throw 0;o={habits:j.habits.map(norm),log:{}};for(const id in j.log||{}){const l=o.log[id.replace(/[^\w-]/g,'')]={};for(const k in j.log[id])if(/^\d{4}-\d\d-\d\d$/.test(k)&&+j.log[id][k]>0)l[k]=+j.log[id][k]}}
 }catch(e){return toast('Не удалось прочитать код')}
 PD=o;const n=Object.values(o.log).reduce((s,l)=>s+Object.keys(l).length,0);
 sheet(`${gh('Найдены данные')}<div class="g3"><div class="st"><b>${o.habits.length}</b><span>${pl(o.habits.length,['привычка','привычки','привычек'])}</span></div><div class="st"><b>${n}</b><span>${pl(n,['отметка','отметки','отметок'])}</span></div></div><p class="hint" style="text-align:left">Заменить сотрёт текущие данные. Копия на случай ошибки сохранится на устройстве.</p>
<div class="acts"><button class="btn" data-a="imp" data-v="merge">Добавить к текущим</button><button class="btn p" data-a="imp" data-v="replace">Заменить</button></div>`)}
function doImport(m){try{localStorage.setItem(K+'.bak',JSON.stringify(S))}catch(e){}
 if(m==='replace'){S.habits=PD.habits;S.log=PD.log}else{PD.habits.forEach(h=>{if(!H(h.id))S.habits.push(h)});for(const id in PD.log){const l=S.log[id]=S.log[id]||{};for(const k in PD.log[id])l[k]=Math.max(l[k]||0,PD.log[id][k])}}
 save();PD=null;closeSheet();tab='today';render(1);toast('Данные загружены')}
const copy=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать')):toast('Не удалось скопировать');

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
 switch(a){
 case'tab':if(tab!==v){tab=v;render(1);scrollTo(0,0)}break;
 case'day':sel=dd(v);render();break;
 case'tt':S.theme=(S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';applyTheme();save();render();break;
 case'th':S.theme=v==='auto'?null:v;applyTheme();save();render();break;
 case'new':form();break;case'edit':form(id);break;case'open':detail(id);break;case'x':closeSheet();break;
 case'tick':{const h=H(id),k=b.dataset.k,x=val(h,k),r=b.getBoundingClientRect();let n=h.track==='yn'?(x?0:1):(x>=h.goal?0:Math.min(h.goal,x+step(h)));
  setVal(h,k,n);const fin=n>=h.goal&&x<h.goal;last=n>=h.goal?id:'';render();setTimeout(()=>last='',600);
  if(fin&&ds(today()).p===1){boom(r.x+r.width/2,r.y);toast('Все привычки на сегодня выполнены!')}else if(navigator.vibrate)navigator.vibrate(10);break}
 case'cell':{const h=H(id),k=b.dataset.k;setVal(h,k,val(h,k)>0?0:h.goal);render();detail(id,1);break}
 case'f':F[b.dataset.k]=v;if(b.dataset.k==='track'){F.goal=v==='yn'?1:(F.goal>1?F.goal:5);const g=$('#gi');if(g)g.value=F.goal}fup();break;
 case'dy':{const i=+v;F.days=F.days.includes(i)?F.days.filter(x=>x!==i):[...F.days,i].sort();fup();break}
 case'sv':{const n=F.name.trim();if(!n){toast('Введи название');$('#fn').focus();break}if(!F.days.length){toast('Выбери хотя бы один день');break}
  F.name=n;F.goal=F.track==='yn'?1:Math.max(.5,+F.goal||1);if(F.id)Object.assign(H(F.id),F);else S.habits.push({...F,id:'h'+Date.now().toString(36),desc:'',type:'build',created:key(today())});
  save();closeSheet();render();toast('Сохранено');break}
 case'del':if(!arm(b,'Точно удалить?'))break;S.habits=S.habits.filter(h=>h.id!==id);delete S.log[id];save();closeSheet();render();toast('Удалено');break;
 case'qr':qr();break;case'qnew':gen();break;case'qcp':if(QC)copy(QC);else toast('Код уже истёк');break;
 case'scan':scan();break;case'paste':paste();break;case'pgo':{const t=$('#pt').value;closeSheet();ingest(t);break}
 case'imp':doImport(v);break;
 case'bk':if(!window.CompressionStream)return toast('Браузер не поддерживает сжатие');copy(await enc(9999,0));break;
 case'shr':try{await navigator.share({title:'KRL Habits — копия',text:await enc(9999,0)})}catch(e){}break;
 case'file':$('#fi').click();break;
 case'rst':if(!arm(b,'Нажми ещё раз для подтверждения'))break;try{localStorage.setItem(K+'.bak',JSON.stringify(S))}catch(x){}S.habits=[];S.log={};save();render();toast('Данные удалены');break}});
$('#fi').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)ingest(await f.text())});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
applyTheme();buildNav();render(1);
</script>
