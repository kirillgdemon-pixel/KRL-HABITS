<body>

<div id="wl"></div><div id="sh"></div><div class="tt" id="tt"></div><input type="file" id="fi" accept=".json" hidden>
<script>
const K='krl.habits.v1',$=s=>$$(s)[0],$$=s=>document.querySelectorAll(s),pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d},dd=k=>new Date(k+'T12:00'),dow=d=>(d.getDay()+6)%7;
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'],ALL=[0,1,2,3,4,5,6];
const COL=['#f08080','#f4a259','#f6c453','#f9d54a','#b4e05a','#6ed98a','#5fd4a2','#4fd3c0','#58cde8','#4dabf5','#5b8def','#7b86f2','#9b82f5','#b57cf5','#d17cf5','#e873c8','#ee7aa6','#f27a85','#9aa6bd','#a0a3ad','#b3afa6'];
const EMO=['💧','🏃','💪','📚','🧘','✍️','🍬','🎸','🚶','🤸','😴','🚴','🌍','🦷','🥗','💊','🧠','🎨','💰','📵','☀️'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(n*10)/10;
const mk=(id,name,desc,emoji,color,type,track,goal,unit,days)=>({id,name,desc,emoji,color,type,track,goal,unit,days:days||ALL,created:key(today())});
const starter=()=>[mk('a','Утренняя пробежка','Начни день с пробежки','🏃','#b4e05a','build','yn',1),mk('b','Пить воду','Пей воду в течение дня','💧','#58cde8','build','measure',2,'л'),mk('c','Отжимания','Сила — по одному повторению','💪','#f6c453','build','count',30),mk('d','Читать 20 страниц','Найди время для хорошей книги','📚','#9b82f5','build','measure',20,'стр.'),mk('e','Медитация','Тихая минута для себя','🧘','#6ed98a','build','yn',1),mk('f','Без сахара','Выбери жизнь с меньшим количеством сахара','🍬','#f27a85','quit','yn',1)];
let S=null,page='main',anim=true,last='',F=null,NS=null,off=0,cy=new Date().getFullYear(),cm=new Date();
try{S=JSON.parse(localStorage.getItem(K)||localStorage.getItem('vitok.v1')||localStorage.getItem('ritm.v2'))}catch(e){}
const save=()=>{try{try{S.stats=snap()}catch(e){}localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function demo(){S.habits=starter();S.log={};S.notes={};const t=today();S.habits.forEach(h=>{h.created=key(addD(t,-160));S.log[h.id]={};for(let i=0;i<160;i++){const d=addD(t,-i);if(!h.days.includes(dow(d))||(i===0&&Math.random()<.5))continue;if(Math.random()<.5+.42*(1-i/160))S.log[h.id][key(d)]=h.track==='yn'?1:fmt(h.goal*(Math.random()<.85?1+Math.random()*.3:.3+Math.random()*.5))||1}});
 S.notes={b:{[key(addD(t,-3))]:'Две большие бутылки на столе сработали.',[key(addD(t,-9))]:'Забыл бутылку дома — наверстал вечером.'},f:{[key(addD(t,-5))]:'Выдержал целую неделю без сладкого!'}}}
if(!S||!S.habits){S={theme:null,vw:'cards',habits:[],log:{},notes:{}};save()}
S.notes=S.notes||{};S.vw=S.vw||'cards';
const H=id=>S.habits.find(h=>h.id===id),val=(h,k)=>(S.log[h.id]||{})[k]||0,ok=(h,k)=>val(h,k)>=h.goal;
function setVal(h,k,v){const l=S.log[h.id]=S.log[h.id]||{};v>0?l[k]=fmt(v):delete l[k];save()}
const ds=d=>{const k=key(d),s=S.habits.filter(h=>h.days.includes(dow(d)));const n=s.filter(h=>ok(h,k)).length;return{t:s.length,n,p:s.length?n/s.length:0}};
function streak(h){let c=0,d=today();for(let i=0;i<730;i++,d=addD(d,-1)){if(!h.days.includes(dow(d)))continue;if(ok(h,key(d)))c++;else if(i>0)break}return c}
function best(h){const ks=Object.keys(S.log[h.id]||{}).sort();if(!ks.length)return 0;let d=dd(ks[0]),b=0,c=0;for(;d<=today();d=addD(d,1)){if(!h.days.includes(dow(d)))continue;if(ok(h,key(d)))b=Math.max(b,++c);else c=0}return b}
function pstreak(){let c=0,d=today();for(let i=0;i<730;i++,d=addD(d,-1)){const s=ds(d);if(!s.t)continue;if(s.p===1)c++;else if(i>0)break}return c}
function rate(h,n){let t=0,o=0,d=today();for(let i=0;i<n;i++,d=addD(d,-1)){if(h.days.includes(dow(d))&&key(d)>=h.created){t++;if(ok(h,key(d)))o++}}return t?Math.round(o/t*100):0}
function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('o');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('o'),2400)}
function boom(x,y,n){for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*6.28,v=70+Math.random()*170;p.className='cf';p.style.cssText=`left:${x}px;top:${y}px;background:hsl(${Math.random()*360} 90% 62%);--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v-90}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}}
function cu(){$$('[data-n]').forEach(e=>{const n=+e.dataset.n,s=e.dataset.s||'',t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);e.textContent=fmt(n*(1-(1-p)**3))+s;if(p<1)requestAnimationFrame(f)})(t0)})}

const ring=p=>`<svg class="rg" viewBox="0 0 36 36"><circle class="a" cx="18" cy="18" r="15"/><circle class="b" cx="18" cy="18" r="15" style="stroke-dasharray:${Math.min(1,p)*94.25} 94.25"/></svg>`;
function act(h,d){const k=key(d),v=val(h,k),dn=v>=h.goal,c=`ck${h.track==='yn'?'':' rb'}${dn?' on':''}${last===h.id+k?' pop':''}`;
 return `<button class="${c}" data-act="cell" data-id="${h.id}" data-k="${k}" data-lp aria-label="Отметить">${dn?I('ck'):h.track==='yn'?I('plus'):ring(v/h.goal)+'<span>'+I('plus')+'</span>'}</button>`}
function heat(h,W,lab){const t=today(),tk=key(t),st=addD(addD(t,-dow(t)),-(W-1)*7);let o=`<div class="hm${lab?' lb':''}" style="--w:${W};--c:${h.color}">`;
 if(lab)o+='<b></b>'+[0,1,2,3,4,5,6].map(r=>`<b class="rl">${[1,3,5].includes(r)?DN[r]:''}</b>`).join('');
 let pm=-1;for(let w=0;w<W;w++){const d0=addD(st,w*7),m=d0.getMonth();o+=`<b>${m!==pm?MN[m]:''}</b>`;pm=m;
  for(let r=0;r<7;r++){const d=addD(d0,r),k=key(d);if(d>t){o+='<i class="f"></i>';continue}const v=val(h,k),g=h.goal;
   o+=`<i style="--i:${w*7+r};${v>=g?'background:var(--c)':v>0?`background:color-mix(in srgb,var(--c) ${25+v/g*50}%,var(--c2))`:''}"${k===tk?' class="td"':''}></i>`}}
 return o+'</div>'}
const empty=()=>`<div class="empty">${LOGO(56)}<b>Пока пусто</b>Нажми «+», чтобы добавить первую привычку.</div>`;
const sub=h=>h.track==='yn'?esc(h.desc):`${fmt(val(h,key(today())))} / ${h.goal} ${esc(h.unit)}${h.desc?' · '+esc(h.desc):''}`;

function vCards(){return S.habits.map((h,i)=>`<div class="card" style="--c:${h.color};--i:${i}" data-act="open" data-id="${h.id}"><div class="ch"><div class="ic">${ei(h.emoji)}</div><div class="mid"><b>${esc(h.name)}</b><small>${sub(h)}</small></div>${act(h,today())}</div>${heat(h,20)}</div>`).join('')||empty()}

function vTable(){const tk=key(today()),e=addD(today(),-off*5),days=[4,3,2,1,0].map(i=>addD(e,-i));

 const f=d=>d.getDate()+' '+MN[d.getMonth()];
 return `<div class="rng"><span class="chip">Последние 5 дней</span><div class="sp"></div><span class="mono">${f(days[0])} — ${f(days[4])}</span><button class="ib s" data-act="off" data-v="1">${I('l')}</button><button class="ib s" data-act="off" data-v="-1">${I('r')}</button></div>
 <div class="tbl stg"><div class="tr hd" style="--i:0"><span class="mono" style="text-align:left">${S.habits.length} привычек</span>${days.map(d=>`<div class="th${key(d)===tk?' t':''}">${DN[dow(d)]}<br>${d.getDate()}</div>`).join('')}</div>${rows}</div>`}

function vDetail(h){
 const t=today(),tk=key(t),u=h.track==='measure'?' '+h.unit:'';let tot=0,sch=0,okd=0,mo=Array(12).fill(0);
 for(let d=new Date(cy,0,1,12);d.getFullYear()===cy&&d<=t;d=addD(d,1)){const k=key(d),v=val(h,k);tot+=v;if(h.days.includes(dow(d))&&k>=h.created){sch++;if(v>=h.goal)okd++}if(v>=h.goal)mo[d.getMonth()]++}
 const rt=sch?Math.round(okd/sch*100):0,mx=Math.max(1,...mo),pts=mo.map((v,i)=>[10+i*25.45,70-v/mx*58]),ln=pts.map(p=>p.join(',')).join(' ');
 const f=new Date(cm.getFullYear(),cm.getMonth(),1,12),s0=addD(f,-dow(f));let cal='';
 for(let i=0;i<42;i++){const d=addD(s0,i),k=key(d),v=val(h,k);cal+=`<button class="dc${v>=h.goal?' on':v>0?' pt':''}${d.getMonth()===f.getMonth()?'':' ot'}${k===tk?' td':''}${(S.notes[h.id]||{})[k]?' nt':''}${last===h.id+k?' pop':''}" data-act="cell" data-id="${h.id}" data-k="${k}" data-lp>${d.getDate()}</button>`}

 return `<div class="top"><button class="ib" data-act="back" aria-label="Назад">${I('l')}</button><div class="sp"></div><button class="ib" data-act="edit" data-id="${h.id}" aria-label="Изменить">${I('pen')}</button></div>
 <div class="stg" style="--c:${h.color}"><div class="dh" style="--i:0"><div class="ic L">${ei(h.emoji)}</div><div><h1>${esc(h.name)}</h1><p>${esc(h.desc)}</p></div></div>

 <div class="box" style="--i:4"><h3>Заметки</h3>${nts||'<small>Заметок пока нет. Удерживай день в календаре.</small>'}</div>
 <div class="yr" style="--i:5"><button class="ib s" data-act="yr" data-v="-1">${I('l')}</button><span>${cy}</span><button class="ib s" data-act="yr" data-v="1">${I('r')}</button></div>

const LOGO=z=>`<svg class="lg" width="${z}" height="${z}" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcff72"/><stop offset="1" stop-color="#3fd0a0"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#lgg)"/><path d="M17 12v24M18 25l12-13M20.5 24.5L31 36" fill="none" stroke="#0a1008" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="dt" cx="35" cy="13" r="3" fill="#0a1008"/></svg>`,LOGO0=z=>`<svg class="lg" width="${z}" height="${z}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path class="o1" d="M24 17a7 7 0 1 1-7 7"/><path class="o2" d="M24 10a14 14 0 1 1-14 14" opacity=".7"/><path class="o3" d="M24 3a21 21 0 1 1-21 21" opacity=".4"/><circle class="dt" cx="24" cy="24" r="2.6" fill="currentColor" stroke="none"/></svg>`;
$$('#pill button').forEach((b,i)=>b.innerHTML=I(['grid','tbl','list'][i]));
const greet=()=>{const h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'};
function snap(){const T=totals(),ms=Math.max(0,...S.habits.map(h=>Math.max(streak(h),best(h))));return{v:1,updated:new Date().toISOString(),completions:T.ci,perfectDays:T.pd,perfectStreak:pstreak(),bestStreak:ms,habits:S.habits.map(h=>({id:h.id,name:h.name,streak:streak(h),best:best(h),rate30:rate(h,30),days:Object.keys(S.log[h.id]||{}).length}))}}
function topBar(){return `<div class="top"><button class="ib" data-act="set" aria-label="Настройки">${I('gear')}</button><div class="brand">${LOGO(22)}<span>KRL Habits</span></div><div class="sp"></div><button class="ib" data-act="stats" aria-label="Статистика">${I('chart')}</button><button class="ib p" data-act="new" aria-label="Новая привычка">${I('plus')}</button></div><div class="hello stg"><small>${greet()},</small><h1>${esc((S.profile&&S.profile.name)||'друг')}</h1></div>`}
function menu(){sheet(`<div class="mh">${LOGO(40)}<div><h3>KRL Habits</h3><small>Данные хранятся только на этом устройстве</small></div></div><button class="mi" data-act="th">${I('sun')} Сменить тему</button><button class="mi" data-act="json">${I('code')} Статистика (JSON)</button><button class="mi" data-act="exp">${I('dl')} Экспорт данных</button><button class="mi" data-act="imp">${I('up')} Импорт данных</button><button class="mi" data-act="demo">${I('spark')} Демо-данные</button><button class="mi" data-act="rst" style="color:#ff6b81">${I('trash')} Сбросить всё</button>`)}
function jsheet(){const j=JSON.stringify(S.stats||snap(),null,2);sheet(`<h3 style="margin-bottom:4px">Статистика на устройстве</h3><p style="margin-bottom:10px">JSON в памяти браузера, ключ <span class="mono">${K}</span> · ${(JSON.stringify(S).length/1024).toFixed(1)} КБ</p><pre class="js">${esc(j)}</pre><div class="acts"><button class="btn" data-act="cp">Копировать</button><button class="btn p" data-act="exp">Скачать всё</button></div>`)}
const PK=[['💧','Пить воду','Вода — основа дня','measure',2,'л'],['🏃','Пробежка','Начни день с движения','yn',1],['📚','Чтение','Страницы складываются в книги','measure',20,'стр.'],['🧘','Медитация','Тихая минута для себя','yn',1],['😴','Ранний сон','Отбой до 23:00','yn',1],['💪','Отжимания','По одному повторению','count',30],['🍬','Без сахара','Выбери лёгкость','yn',1,'','quit']];
const W={s:0,name:(S.profile&&S.profile.name)||'',pk:[0,1,2]};
function wel(){const w=$('#wl');w.className='o';w.innerHTML=W.s===0?`<div class="wc"><div class="wlogo">${LOGO(120)}</div><h1 class="wt">KRL Habits</h1><p class="ws">Маленькие шаги каждый день — и привычки становятся частью тебя. Начнём?</p><label>Как тебя зовут?</label><input class="in" id="wn" maxlength="24" placeholder="Имя" autocomplete="given-name" value="${esc(W.name)}"><button class="btn p wb" data-act="w1">${S.habits.length?'Войти':'Дальше'}</button></div>`
:`<div class="wc"><h1 class="wt s">С чего начнём, ${esc(W.name)}?</h1><p class="ws">Выбери привычки — потом всё можно изменить.</p><div class="wg">${PK.map((p,i)=>`<button class="${W.pk.includes(i)?'on':''}" style="--c:${COL[i*3]}" data-act="wp" data-v="${i}">${ei(p[0])}<b>${p[1]}</b></button>`).join('')}</div><div class="acts"><button class="btn" data-act="w2" data-v="0">С нуля</button><button class="btn p" data-act="w2" data-v="1">Готово</button></div></div>`}
function fin(on){if(on)W.pk.forEach(i=>{const p=PK[i];S.habits.push(mk('p'+i+Date.now().toString(36),p[1],p[2],p[0],COL[i*3],p[6]||'build',p[3],p[4],p[5]||''))});
 S.profile={name:W.name,done:1,since:key(today())};save();$('#wl').className='';anim=true;render();setTimeout(()=>boom(innerWidth/2,innerHeight/3,44),300);try{navigator.storage.persist()}catch(x){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=+b.dataset.v;
 if(a==='w1'){const n=$('#wn').value.trim();if(!n)return toast('Как к тебе обращаться?');W.name=n;if(S.habits.length)fin(0);else{W.s=1;wel()}}
 else if(a==='wp'){W.pk=W.pk.includes(v)?W.pk.filter(x=>x!==v):[...W.pk,v];b.classList.toggle('on')}
 else if(a==='w2')fin(v);else if(a==='json')jsheet();
 else if(a==='cp'){const t=JSON.stringify(S.stats||snap(),null,2);navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>toast('Не удалось')):toast('Не удалось')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wn')$('[data-act=w1]').click()});
const FL=(z,off)=>`<svg class="fl${off?' off':''}" width="${z}" height="${Math.round(z*1.06)}" viewBox="0 0 32 34" aria-hidden="true"><defs><linearGradient id="fg1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d1a"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffd75e"/></linearGradient></defs><path class="f1" d="M16 2c1 6 9 10 9 20a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 1 5 3 5-1-6-1-12 2-17z" fill="url(#fg1)"/><path class="f2" d="M16 31a5 5 0 0 1-5-5c0-3 2-4 3-6 1 2 2 2 3 2 1-1 1-2 1-3 2 2 3 4 3 7a5 5 0 0 1-5 5z" fill="#fff1a8"/></svg>`;
function strip(){const s=ds(today()),p=Math.round(s.p*100),k=pstreak(),C=2*Math.PI*19,f=pv*C;pv=s.p;return `<div class="strip${s.t&&s.p===1?' all':''}"><div class="pr" style="--f:${f}"><svg viewBox="0 0 44 44"><circle class="a" cx="22" cy="22" r="19"/><circle class="b" cx="22" cy="22" r="19" style="stroke-dasharray:${s.p*C} ${C}"/></svg><b>${p}%</b></div><div class="mid"><b>Сегодня ${s.n} из ${s.t}</b><small>${!s.t?'На сегодня привычек нет':s.p===1?'Все привычки выполнены':'Осталось: '+(s.t-s.n)}</small></div><div class="sk">${FL(24,!k)}<b>${k}</b></div></div>`}
P0.minus='<path d="M5 12h14"/>';
let ct,pv=0,px=0,py=0;
function totals(){const set=new Set();S.habits.forEach(h=>Object.keys(S.log[h.id]||{}).forEach(k=>set.add(k)));let ci=0,pd=0;set.forEach(k=>{const s=ds(dd(k));ci+=s.n;if(s.t&&s.p===1)pd++});return{ci,pd}}
function sheet(h){clearTimeout(ct);const s=$('#sh');s.classList.remove('cl');s.innerHTML=`<div class="bk" data-act="x"></div><div class="pn"><i class="grab"></i>${h}</div>`;s.classList.add('o');[...$('.pn').children].forEach((c,i)=>c.style.setProperty('--j',i))}
function vCards(){return S.habits.map((h,i)=>{const s=streak(h);return `<div class="card${ok(h,key(today()))?' dn':''}" style="--c:${h.color};--i:${i}" data-act="open" data-id="${h.id}"><div class="ch"><div class="ic">${ei(h.emoji)}</div><div class="mid"><b>${esc(h.name)}</b><small>${sub(h)}</small></div>${s>1?`<span class="sb">${FL(14)}${s}</span>`:''}${act(h,today())}</div>${heat(h,20)}</div>`}).join('')||empty()}
function form(){const dp=(v,l)=>`<button class="chip" data-act="dp" data-v="${v}">${l}</button>`;
sheet(`<div class="gh"><button class="ib" data-act="x" aria-label="Закрыть">${I('x')}</button><h3>${F.id?'Изменить привычку':'Новая привычка'}</h3></div>
<div class="pv"><div class="ic L" id="pvi"></div><div class="mid"><b id="pvn"></b><small id="pvs"></small></div></div>
<label>Иконка</label><div class="eg">${EMO.map(e=>`<button data-act="em" data-v="${e}" aria-label="Иконка">${ei(e)}</button>`).join('')}</div>
<label>Название</label><input class="in" id="fn" maxlength="40" placeholder="Например, растяжка" value="${esc(F.name)}" oninput="F.name=this.value;fup()">
<label>Описание</label><input class="in" maxlength="60" placeholder="Зачем тебе это" value="${esc(F.desc)}" oninput="F.desc=this.value">
<label>Цвет</label><div class="cg">${COL.map(c=>`<button style="--c:${c}" data-act="co" data-v="${c}" aria-label="Цвет"></button>`).join('')}</div>
<label>Тип привычки</label>${seg('type',[['build','Выработать'],['quit','Бросить']],F.type)}<p class="hint" id="hn"></p>
<label>Учёт</label>${seg('track',[['yn','Да / Нет'],['count','Счётчик'],['measure','Измерение']],F.track)}
<div class="fx" id="fx"><div><div class="two"><div><label>Цель в день</label><div class="stp"><button class="ib s" data-act="gs" data-v="-1" aria-label="Меньше">${I('minus')}</button><input class="in" id="gi" type="number" inputmode="decimal" step="any" value="${F.goal}" oninput="F.goal=+this.value;fup()"><button class="ib s" data-act="gs" data-v="1" aria-label="Больше">${I('plus')}</button></div></div><div id="fu"><label>Единица</label><input class="in" maxlength="8" placeholder="км, л, стр." value="${esc(F.unit)}" oninput="F.unit=this.value;fup()"></div></div></div></div>
<label>Дни недели</label><div class="row" style="margin-bottom:8px">${dp('all','Каждый день')}${dp('wk','Будни')}${dp('we','Выходные')}</div><div class="row">${DN.map((n,i)=>`<button class="dy" data-act="dy" data-v="${i}">${n}</button>`).join('')}</div>
<div class="acts">${F.id?'<button class="btn d" data-act="del">Удалить</button>':''}<button class="btn p" data-act="sv">Сохранить</button></div>`);
fup();if(!F.id&&matchMedia('(pointer:fine)').matches)setTimeout(()=>$('#fn')&&$('#fn').focus(),350)}
function fup(bump,sync){if(!$('#pvi'))return;const iy=F.track==='yn',D=F.days.join(),me=F.track==='measure',g=+F.goal||1,PS={all:ALL,wk:[0,1,2,3,4],we:[5,6]};
 $('.pn').style.setProperty('--c',F.color);
 $$('.eg button').forEach(b=>b.classList.toggle('on',b.dataset.v===F.emoji));$$('.cg button').forEach(b=>b.classList.toggle('on',b.dataset.v===F.color));
 $$('.seg button').forEach(b=>b.classList.toggle('on',F[b.dataset.k]===b.dataset.v));$$('.dy').forEach(b=>b.classList.toggle('on',F.days.includes(+b.dataset.v)));
 $$('[data-act=dp]').forEach(b=>b.classList.toggle('on',D===PS[b.dataset.v].join()));
 $('#fx').classList.toggle('o',!iy);$('#fu').style.display=me?'':'none';$('#fx .two').style.gridTemplateColumns=me?'1fr 1fr':'1fr';
 $('#hn').textContent=F.type==='quit'?'Отмечай каждый день, когда удержался.':'Отмечай каждый день, когда сделал.';
 $('#pvn').textContent=F.name.trim()||'Новая привычка';
 $('#pvs').textContent=(iy?'Да / Нет':g+' '+(me?(F.unit||''):'раз')+' в день')+' · '+(F.days.length===7?'каждый день':F.days.map(i=>DN[i]).join(', '));
 $('#pvi').innerHTML=ei(F.emoji);if(sync)$('#gi').value=F.goal;
 if(bump){const i=$('#pvi');i.classList.remove('pop');void i.offsetWidth;i.classList.add('pop')}}
function shake(e){if(!e)return;e.classList.remove('shk');void e.offsetWidth;e.classList.add('shk');e.focus&&e.focus()}
function arm(b,t){if(b.dataset.ar)return 1;b.dataset.ar=1;b.dataset.o=b.innerHTML;b.textContent=t;b.classList.add('shk');setTimeout(()=>{if(b.isConnected){delete b.dataset.ar;b.innerHTML=b.dataset.o}},2800);return 0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!F)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='dp'){F.days=v==='all'?[...ALL]:v==='wk'?[0,1,2,3,4]:[5,6];fup()}
 else if(a==='gs'){const st=F.track==='measure'&&F.goal<10?.5:1;F.goal=Math.max(st,fmt((+F.goal||0)+(+v)*st));$('#gi').value=F.goal;fup()}});
document.addEventListener('pointerdown',e=>{lf=0;px=e.clientX;py=e.clientY},true);
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-px,e.clientY-py)>10)clearTimeout(lt)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.mi,.ib');if(!b)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,o=document.createElement('span');o.className='rp';o.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(o);setTimeout(()=>o.remove(),600)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.grab'))return;const p=$('.pn'),y0=e.clientY;let d=0;p.style.animation='none';
 const mv=m=>{d=Math.max(0,m.clientY-y0);p.style.transform=`translate(-50%,${d}px)`},
 up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);p.style.transition='transform .25s';p.style.transform=d>90?'translate(-50%,100%)':'translate(-50%,0)';if(d>90)setTimeout(close,120)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)});

render();
if(!S.profile||!S.profile.done)wel();
</script>
